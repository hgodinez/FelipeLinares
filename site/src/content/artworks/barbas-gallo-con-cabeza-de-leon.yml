description:
  es: >-
    Un gallito entró un día a la casa de los Linares, subió las escaleras y se quedó como mascota; el padre de
    Felipe lo llamó Barbas y el gallo lo seguía a todas partes. Felipe quiso convertir ese recuerdo en un alebrije
    y, mientras pensaba qué cabeza ponerle, su padre le propuso una de león «para que se vea fuerte, imponente».
    La pieza nació así de la colaboración entre padre e hijo.
  en: >-
    One day a little rooster walked into the Linares home, climbed the stairs and stayed as a pet; Felipe's
    father named it Barbas and the rooster followed him everywhere. Felipe wanted to turn that memory into an
    alebrije and, while he wondered what head to give it, his father suggested a lion's "so it looks strong and
    imposing." The piece was born of the collaboration between father and son.
context:
  es: >-
    Obra documentada por el testimonio en video de Felipe Linares Vargas. Un alebrije de gallo de su autoría forma
    parte de la exposición itinerante del Museum of International Folk Art (2026–2028); si se trata de esta misma
    pieza está por confirmar.
  en: >-
    Work documented by Felipe Linares Vargas's video testimony. A rooster alebrije of his is part of the Museum of
    International Folk Art's traveling exhibition (2026–2028); whether it is this same piece is to be confirmed.
