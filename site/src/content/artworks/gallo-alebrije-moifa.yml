description:
  es: >-
    Alebrije con forma de gallo incluido en la exposición itinerante «Alebrijes: A Linares Family Tradition»,
    organizada por el Museum of International Folk Art de Santa Fe, Nuevo México, y presentada a partir de
    mayo de 2026 en el Consulado de México en Albuquerque. La prensa local documentó la pieza junto a una obra
    de Leonardo Linares Vargas.
  en: >-
    Rooster-shaped alebrije included in the traveling exhibition "Alebrijes: A Linares Family Tradition",
    organized by the Museum of International Folk Art in Santa Fe, New Mexico, and presented from May 2026 at
    the Consulate of Mexico in Albuquerque. Local press documented the piece alongside a work by Leonardo
    Linares Vargas.
