title:
  es: Alebrije de jaguar con astas de venado
  en: Jaguar alebrije with deer antlers
titleStatus: provisional
categories: [alebrijes]
featured: true
order: 1
materials:
  es: "Cartonería tradicional: papel y cartón modelados sobre estructura, engrudo, pintura y acabado brillante. Detalles técnicos por confirmar con el artista."
  en: "Traditional cartonería: paper and cardboard modeled over an armature, paste, paint and gloss finish. Technical details to be confirmed with the artist."
description:
  es: >-
    Un felino de cabeza negra con orejas rojas y colmillos curvos, coronado por una cornamenta de venado que se
    abre como las ramas de un árbol. El cuerpo, moteado de jaguar en ocre y negro, se prolonga en alas de
    murciélago pintadas en rojo con nervaduras blancas; las garras, verdes y escamosas, terminan en uñas de
    marfil. La lengua, larga y vermellón, asoma entre colmillos y responde a la tradición de los alebrijes
    de la familia Linares: criaturas que reúnen en un solo cuerpo partes de varios animales.
  en: >-
    A black-headed feline with red ears and curved tusks, crowned by deer antlers that open like the
    branches of a tree. The jaguar-spotted body in ochre and black extends into bat wings painted red with
    white veins; the green, scaled claws end in ivory nails. A long vermilion tongue emerges between the
    fangs, in the tradition of the Linares family's alebrijes: creatures that gather parts of several
    animals in a single body.
context:
  es: >-
    La pieza muestra el modo en que la cartonería de la Ciudad de México combina modelado volumétrico con una
    pintura meticulosa de patrones: manchas, escamas, nervaduras y pelaje se resuelven a pincel sobre la
    superficie de papel. Se incluyen fotografías tomadas en el taller de una pieza de este mismo diseño antes
    del acabado final, útiles para apreciar el proceso.
  en: >-
    The piece shows how Mexico City cartonería combines volumetric modeling with meticulous pattern painting:
    spots, scales, veins and fur are all resolved by brush on the paper surface. Workshop photographs of a
    piece of this same design before its final finish are included to help appreciate the process.
availability: unknown
