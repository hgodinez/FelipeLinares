description:
  es: >-
    Obra en la colección del Museo Nacional de Culturas Populares (Secretaría de Cultura, Ciudad de México).
    El tzompantli era, en el México antiguo, la estructura en la que se exhibían cráneos; la pieza traslada
    esa imagen al lenguaje de la cartonería y de las calaveras del Día de Muertos.
  en: >-
    Work in the collection of the Museo Nacional de Culturas Populares (Ministry of Culture, Mexico City).
    In ancient Mexico the tzompantli was the rack on which skulls were displayed; the piece carries that image
    into the language of cartonería and Day of the Dead skulls.
context:
  es: >-
    La pieza forma parte del relato digital «La fiesta de la muerte en México», publicado por el museo en
    Google Arts & Culture. Es una de las obras del artista con ficha museográfica pública.
  en: >-
    The piece appears in the digital story "The Festival of Death in Mexico", published by the museum on
    Google Arts & Culture. It is one of the artist's works with a public museum record.
