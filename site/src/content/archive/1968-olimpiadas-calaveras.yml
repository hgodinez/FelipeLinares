summary:
  es: Fuentes museográficas registran que Felipe Linares Mendoza recibió el encargo de realizar atletas esqueléticos con motivo de los Juegos Olímpicos; el programa cultural de 1968 también difundió la obra de Pedro Linares.
  en: Museum sources record that Felipe Linares Mendoza was commissioned to make skeletal athletes for the Olympic Games; the 1968 cultural program also promoted the work of Pedro Linares.
