summary:
  es: Exposición y catálogo (Susan N. Masuoka) dedicados a tres generaciones de cartoneros de la familia Linares, con énfasis en las calaveras y los alebrijes.
  en: Exhibition and catalogue (Susan N. Masuoka) devoted to three generations of Linares family cartoneros, with emphasis on skeletons and alebrijes.
body:
  es: >-
    El catálogo sigue siendo la referencia bibliográfica más completa sobre la familia en inglés. La
    participación específica de Felipe Linares Vargas en esta exposición no está verificada en las fuentes
    consultadas.
  en: >-
    The catalogue remains the most complete bibliographic reference on the family in English. The specific
    participation of Felipe Linares Vargas in this exhibition is not verified in the sources consulted.
