summary:
  es: Convaleciente de una grave enfermedad, Pedro Linares López sueña con criaturas de colores que repiten la palabra «alebrijes» y comienza a modelarlas en cartonería.
  en: "Convalescing from a serious illness, Pedro Linares López dreams of colorful creatures repeating the word \"alebrijes\" and begins to model them in cartonería."
