title:
  es: Primer Desfile de Alebrijes Monumentales del Museo de Arte Popular
  en: First Monumental Alebrije Parade of the Museo de Arte Popular
type: event
subject: tradition
year: 2007
institution: Museo de Arte Popular
city: Ciudad de México
order: 14
summary:
  es: El Museo de Arte Popular inicia el desfile anual de alebrijes monumentales por el Paseo de la Reforma, que consolida al alebrije como emblema de la Ciudad de México.
  en: The Museo de Arte Popular launches the annual parade of monumental alebrijes along Paseo de la Reforma, establishing the alebrije as an emblem of Mexico City.
