summary:
  es: Exposición bilingüe itinerante con obras de tres generaciones de la familia Linares, inaugurada en el Consulado de México en Albuquerque. Incluye un alebrije de gallo de Felipe Linares Vargas.
  en: Bilingual traveling exhibition with works by three generations of the Linares family, opened at the Consulate of Mexico in Albuquerque. Includes a rooster alebrije by Felipe Linares Vargas.
body:
  es: >-
    Adaptación de la exposición «La Cartonería Mexicana / The Mexican Art of Paper and Paste» del Museum of
    International Folk Art (Santa Fe). Curaduría de Nora Dolan (MOIFA) y Marta Turok. Se inauguró el 5 de mayo
    de 2026 en el Consulado de México en Albuquerque y recorrerá comunidades de Nuevo México y el suroeste de
    Estados Unidos hasta 2028. La cobertura de KUNM documenta un alebrije de gallo de Felipe Linares Vargas y
    un alebrije de gato de Leonardo Linares Vargas.
  en: >-
    An adaptation of the Museum of International Folk Art's exhibition "La Cartonería Mexicana / The Mexican
    Art of Paper and Paste" (Santa Fe). Curated by Nora Dolan (MOIFA) and Marta Turok. It opened on May 5, 2026
    at the Consulate of Mexico in Albuquerque and will travel to communities across New Mexico and the
    Southwest through 2028. KUNM's coverage documents a rooster alebrije by Felipe Linares Vargas and a cat
    alebrije by Leonardo Linares Vargas.
