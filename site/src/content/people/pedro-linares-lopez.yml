  en: Creator of the alebrijes · National Prize for Arts and Sciences, 1990
bio:
  es: >-
    Nació en la Ciudad de México el 29 de junio de 1906 y murió en enero de 1992. Cartonero desde niño,
    aprendió el oficio de su padre y fabricó judas, piñatas y calaveras; entre sus clientes estuvieron Diego
    Rivera y Frida Kahlo. En 1936, convaleciente de una grave enfermedad, soñó con un bosque poblado por
    criaturas de colores que repetían la palabra «alebrijes». Al recuperarse comenzó a modelarlas en papel y
    cartón, y con ello creó una categoría nueva dentro de la cartonería mexicana. El documental de Judith
    Bronowski (1975) difundió su trabajo internacionalmente y en 1990 recibió el Premio Nacional de Ciencias y
    Artes en el área de Artes y Tradiciones Populares. Su obra se conserva en museos de México y del extranjero.
  en: >-
    Born in Mexico City on 29 June 1906, he died in January 1992. A cartonero since childhood, he learned the
    craft from his father and made Judas figures, piñatas and skulls; his clients included Diego Rivera and
    Frida Kahlo. In 1936, convalescing from a serious illness, he dreamed of a forest inhabited by colorful
    creatures repeating the word "alebrijes". On recovering he began to model them in paper and cardboard,
    creating a new category within Mexican cartonería. Judith Bronowski's 1975 documentary spread his work
    internationally, and in 1990 he received Mexico's National Prize for Arts and Sciences in the Popular Arts
    and Traditions category. His work is held by museums in Mexico and abroad.
