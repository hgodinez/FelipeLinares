bio:
  es: >-
    Hijo de Felipe Linares Mendoza y nieto de Pedro Linares López. Aprendió el oficio sentado junto a su padre
    en las tardes después de la secundaria; estudió la licenciatura en programación, pero eligió el taller
    porque ahí, dice, expresaba su creatividad. Trabaja alebrijes, calaveras y figuras de temporada en la
    Ciudad de México, a menudo en colaboración con su padre. Su obra «Tzompantli» (2010) forma parte de la
    colección del Museo Nacional de Culturas Populares, y un alebrije de gallo de su autoría integra la
    exposición itinerante «Alebrijes: A Linares Family Tradition» del Museum of International Folk Art (2026–2028).
  en: >-
    Son of Felipe Linares Mendoza and grandson of Pedro Linares López. He learned the craft sitting beside his
    father on afternoons after secondary school; he earned a degree in programming but chose the workshop
    because there, he says, he expressed his creativity. He makes alebrijes, skeletons and seasonal figures in
    Mexico City, often in collaboration with his father. His work "Tzompantli" (2010) is in the collection of
    the Museo Nacional de Culturas Populares, and a rooster alebrije of his is part of the Museum of
    International Folk Art's traveling exhibition "Alebrijes: A Linares Family Tradition" (2026–2028).
