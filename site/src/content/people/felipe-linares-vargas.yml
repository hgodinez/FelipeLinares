bio:
  es: >-
    Hijo de Felipe Linares Mendoza y nieto de Pedro Linares López. Trabaja la cartonería en la Ciudad de
    México dentro de la tradición familiar: alebrijes, calaveras y figuras de temporada. Su obra «Tzompantli»
    (2010) forma parte de la colección del Museo Nacional de Culturas Populares, y un alebrije de gallo de su
    autoría integra la exposición itinerante «Alebrijes: A Linares Family Tradition» del Museum of
    International Folk Art (2026–2028).
  en: >-
    Son of Felipe Linares Mendoza and grandson of Pedro Linares López. He works in cartonería in Mexico City
    within the family tradition: alebrijes, skeletons and seasonal figures. His work "Tzompantli" (2010) is in
    the collection of the Museo Nacional de Culturas Populares, and a rooster alebrije of his is part of the
    Museum of International Folk Art's traveling exhibition "Alebrijes: A Linares Family Tradition" (2026–2028).
