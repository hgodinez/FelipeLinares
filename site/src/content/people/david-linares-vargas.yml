  es: >-
    Hijo de Felipe Linares Mendoza. Participó en junio de 2025, junto con Gerardo Linares Gómez, en el
    conversatorio del Museo Nacional de Culturas Populares con motivo del 119 aniversario del nacimiento de
    Pedro Linares.
