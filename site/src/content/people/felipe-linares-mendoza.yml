bio:
  es: >-
    Hijo de Pedro Linares López y padre de Felipe Linares Vargas. Es reconocido sobre todo por sus calaveras
    animadas: esqueletos en movimiento que retoman la tradición de José Guadalupe Posada. Fuentes museográficas
    registran que recibió el encargo de realizar atletas esqueléticos para los Juegos Olímpicos de México 1968
    y que, para el Día de Muertos de 1986, creó una obra sobre el sismo de 1985 con más de cincuenta esqueletos
    de tamaño natural. Su hijo Leonardo describe su aportación como el pulimento de las piezas para trabajarlas
    como esculturas y una pintura meticulosa en el detalle. Obras suyas se encuentran en colecciones como las
    del Centre Pompidou y el British Museum, según las fuentes consultadas.
  en: >-
    Son of Pedro Linares López and father of Felipe Linares Vargas. He is best known for his animated skeletons:
    skeletons in motion that draw on the tradition of José Guadalupe Posada. Museum sources record that he was
    commissioned to make skeletal athletes for the Mexico City 1968 Olympic Games and that, for the Day of the
    Dead in 1986, he created a work about the 1985 earthquake with more than fifty life-size skeletons. His son
    Leonardo describes his contribution as the polishing of pieces so they are worked as sculptures, and a
    meticulous attention to painted detail. His works are held in collections such as the Centre Pompidou and
    the British Museum, according to the sources consulted.
