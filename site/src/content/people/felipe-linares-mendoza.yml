bio:
  es: >-
    Hijo de Pedro Linares López y padre de Felipe, Leonardo y David Linares Vargas. Cuenta que su primer
    alebrije fue una figura parecida a un armadillo con una calavera encima, y que su padre llegó a decirle
    «ya me estás ganando haciendo alebrijes». Es reconocido por sus calaveras animadas y por llevar las piezas
    a un nivel escultórico, con más movimiento y altura y una pintura meticulosa; fuentes museográficas
    registran el encargo de atletas esqueléticos para los Juegos Olímpicos de México 1968 y una obra de 1986
    sobre el sismo de 1985 con más de cincuenta esqueletos de tamaño natural. Ha dado cursos de cartonería en
    San Antonio, Texas, y demostraciones en Los Ángeles, San Diego y Disneylandia. Obras suyas se encuentran en
    colecciones como las del Centre Pompidou y el British Museum, según las fuentes consultadas.
  en: >-
    Son of Pedro Linares López and father of Felipe, Leonardo and David Linares Vargas. He tells that his
    first alebrije was a figure like an armadillo with a skull on top, and that his father went so far as to say
    "you're already beating me at making alebrijes." He is known for his animated skeletons and for bringing
    pieces to a sculptural level, with more movement and height and meticulous painting; museum sources record
    the commission of skeletal athletes for the Mexico City 1968 Olympics and a 1986 work about the 1985
    earthquake with more than fifty life-size skeletons. He has taught cartonería courses in San Antonio,
    Texas, and given demonstrations in Los Angeles, San Diego and Disneyland. His works are held in
    collections such as the Centre Pompidou and the British Museum, according to the sources consulted.
