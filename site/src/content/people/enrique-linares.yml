name: Enrique Linares
shortName: Enrique Linares
generation: 3
parent: pedro-linares-lopez
order: 20
role:
  es: Cartonero · hijo de Pedro Linares López
  en: Cartonero · son of Pedro Linares López
bio:
  es: >-
    Uno de los tres hijos de Pedro Linares López que continuaron el oficio familiar, junto con Felipe y
    Miguel. Las fuentes públicas consultadas lo mencionan como parte de la generación que amplió las
    posibilidades del medio después de los alebrijes; no se dispone de más datos biográficos verificados.
  en: >-
    One of the three sons of Pedro Linares López who continued the family craft, together with Felipe and
    Miguel. The public sources consulted name him as part of the generation that expanded the medium after
    the alebrijes; no further verified biographical data is available.
sources:
