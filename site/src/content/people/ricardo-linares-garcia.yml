role:
  es: Cartonero · nieto de Pedro Linares López
  en: Cartonero · grandson of Pedro Linares López
bio:
  es: >-
    Nieto de Pedro Linares López; trabaja en el taller de La Merced junto a Miguel Linares. Ha participado en
    el International Folk Art Market de Santa Fe y es reconocido por desarrollar nuevos diseños y detalles
    finos en los alebrijes. La relación de parentesco con Miguel Linares se indica según fuentes secundarias.
  en: >-
    Grandson of Pedro Linares López; he works in the La Merced workshop alongside Miguel Linares. He has taken
    part in the International Folk Art Market in Santa Fe and is known for developing new designs and fine
    details in alebrijes. The family relationship to Miguel Linares is stated according to secondary sources.
