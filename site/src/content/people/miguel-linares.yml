role:
  es: Cartonero · hijo de Pedro Linares López
  en: Cartonero · son of Pedro Linares López
bio:
  es: >-
    Hijo de Pedro Linares López. Mantiene taller en la zona de La Merced, en la Ciudad de México, donde ha sido
    entrevistado junto a Ricardo Linares, nieto de Pedro. Es uno de los tres hermanos que recibieron el oficio
    directamente de su padre.
  en: >-
    Son of Pedro Linares López. He keeps a workshop in the La Merced area of Mexico City, where he has been
    interviewed alongside Ricardo Linares, Pedro's grandson. He is one of the three brothers who received the
    craft directly from their father.
