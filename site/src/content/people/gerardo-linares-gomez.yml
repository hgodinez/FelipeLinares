bio:
  es: >-
    Bisnieto de Pedro Linares López. En junio de 2025 participó en el conversatorio del Museo Nacional de
    Culturas Populares junto con David Linares Vargas. Su línea de descendencia directa no se precisa en las
    fuentes consultadas.
